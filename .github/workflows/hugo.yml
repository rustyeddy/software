name: Hugo build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Hugo
        run: |
          curl -fsSL https://github.com/gohugoio/hugo/releases/download/v0.147.9/hugo_0.147.9_linux-amd64.tar.gz | tar -xz hugo
          sudo install hugo /usr/local/bin/hugo
      - run: hugo --buildDrafts --panicOnWarning
      - run: test -s public/course/intro/software-engineering/index.html
      - run: hugo --destination public-release
      - run: test ! -e public-release/course/intro/software-engineering/index.html
